services:
  # ============================================================================
  # 1. KEYCLOAK DATABASE (POSTGRESQL - DEDICATED SOLELY TO IDENTITY DATA)
  # ============================================================================
  keycloak-db:
    image: postgres:16-alpine
    container_name: knowledgeflow-keycloak-db
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB_NAME:-keycloak}
      POSTGRES_USER: ${KEYCLOAK_DB_USER:-keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_dev_password}
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    networks:
      - knowledgeflow-network
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KEYCLOAK_DB_USER:-keycloak} -d ${KEYCLOAK_DB_NAME:-keycloak}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ============================================================================
  # 2. KEYCLOAK IDENTITY PROVIDER (OIDC / IAM)
  # ============================================================================
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: knowledgeflow-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_dev_password}
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-db
      KC_DB_URL_PORT: 5432
      KC_DB_URL_DATABASE: ${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_dev_password}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
    volumes:
      - ./infrastructure/keycloak:/opt/keycloak/data/import
    ports:
      - "8080:8080"
    networks:
      - knowledgeflow-network
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080; echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep 'HTTP/1.1 200 OK' <&3"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ============================================================================
  # 3. MONGODB (MAIN PERSISTENCE: USERS, DOCUMENTS, CHUNKS, CHAT)
  # ============================================================================
  mongodb:
    image: mongo:7.0
    container_name: knowledgeflow-mongodb
    environment:
      MONGO_INITDB_DATABASE: knowledgeflow
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - knowledgeflow-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ============================================================================
  # 4. REDIS (JOB QUEUES VIA BULLMQ & APPLICATION CACHE)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: knowledgeflow-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - knowledgeflow-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ============================================================================
  # 5. BACKEND SERVICE (NESTJS - MAIN APPLICATION CORE)
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: knowledgeflow-backend
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-3000}
      MONGO_URI: ${MONGO_URI:-mongodb://mongodb:27017/knowledgeflow}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      KEYCLOAK_ISSUER_URL: ${KEYCLOAK_ISSUER_URL:-http://localhost:8080/realms/KnowledgeFlow}
      KEYCLOAK_JWKS_URI: ${KEYCLOAK_JWKS_URI:-http://keycloak:8080/realms/KnowledgeFlow/protocol/openid-connect/certs}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai-service:8000}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-change_this_internal_shared_secret_for_dev_mode}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    ports:
      - "3000:3000"
    networks:
      - knowledgeflow-network
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    restart: unless-stopped

  # ============================================================================
  # 6. AI SERVICE (FASTAPI / PYTHON - RAG, EMBEDDINGS, AGENT)
  # ============================================================================
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: knowledgeflow-ai-service
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-change_this_internal_shared_secret_for_dev_mode}
      CHUNK_SIZE: ${CHUNK_SIZE:-500}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-50}
      TOP_K: ${TOP_K:-5}
    ports:
      - "8000:8000"
    networks:
      - knowledgeflow-network
    restart: unless-stopped

  # ============================================================================
  # 7. FRONTEND (REACT / VITE SPA)
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: knowledgeflow-frontend
    environment:
      VITE_API_URL: http://localhost:3000
      VITE_KEYCLOAK_URL: http://localhost:8080
      VITE_KEYCLOAK_REALM: KnowledgeFlow
      VITE_KEYCLOAK_CLIENT_ID: knowledgeflow-frontend
    ports:
      - "5173:5173"
    networks:
      - knowledgeflow-network
    depends_on:
      - backend
    restart: unless-stopped

# ==============================================================================
# NETWORKS & VOLUMES SPECIFICATION
# ==============================================================================
networks:
  knowledgeflow-network:
    name: knowledgeflow-network
    driver: bridge

volumes:
  mongodb_data:
    name: knowledgeflow-mongodb-data
  redis_data:
    name: knowledgeflow-redis-data
  keycloak_db_data:
    name: knowledgeflow-keycloak-db-data
